<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="BSC Lab — open-source sensory stimulation platform and RDF knowledge browser" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <!-- PWA: installable, offline-capable. See docs/technical/PWA_SERVICE_WORKER.md.
         theme-color is the default (paper) skin; a per-skin theme-color is a
         documented future enhancement. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#f7f3ea" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon-180.png" />
    <title>BSC Lab</title>
    <script>
      // Apply the stored (or default) skin before first paint to avoid a
      // flash of the wrong theme. Must stay in sync with src/ui/theme/skins.js.
      (function () {
        try {
          var ids = ['midnight', 'aurora', 'ember', 'daylight', 'paper'];
          var fallback = 'paper';
          var stored = localStorage.getItem('bsclab.skin');
          document.documentElement.dataset.skin =
            ids.indexOf(stored) !== -1 ? stored : fallback;
        } catch (e) {
          document.documentElement.dataset.skin = 'paper';
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div>%sveltekit.body%</div>
  </body>
</html>
