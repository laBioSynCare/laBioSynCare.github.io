<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover hands the screen's safe areas to the page, which
         pads for them (the dock above the home indicator, the content clear of
         a notch in landscape). Without it an installed app's fixed dock sat
         under the iPhone home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- No title element or description here. SvelteKit appends a page's own after
         the shell's rather than replacing them, and a crawler or link preview
         reads only the first, so a static pair here titled every page
         "SSTIM Workbench" and described it as the homepage. Every route sets
         both (scripts/smoke-static.mjs checks), and +error.svelte covers the
         404 fallback. -->
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <!-- PWA: installable, offline-capable. See docs/technical/PWA_SERVICE_WORKER.md
         (incl. the compliance matrix). theme-color is the default (paper) skin;
         a per-skin theme-color is a documented future enhancement. The
         apple-/mobile-web-app-* tags give iOS/legacy Android standalone display
         and status-bar styling that the manifest alone does not on iOS. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#f7f3ea" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SSTIM Workbench" />
    <script>
      // Apply the stored (or default) skin before first paint to avoid a
      // flash of the wrong theme. Must stay in sync with src/ui/theme/skins.js.
      // data-theme is set alongside data-skin because Pico's dark palette is
      // scoped to `:root:not([data-theme])` under a prefers-color-scheme
      // media query; without it, a light skin on a dark-mode OS inherits
      // Pico's dark text on our light surfaces.
      (function () {
        var ids = ['midnight', 'aurora', 'ember', 'daylight', 'paper'];
        var darkIds = ['midnight', 'aurora', 'ember'];
        var fallback = 'paper';
        var skin = fallback;
        try {
          var stored = localStorage.getItem('bsclab.skin');
          if (ids.indexOf(stored) !== -1) skin = stored;
        } catch (e) { /* private mode / storage blocked — keep the default */ }
        document.documentElement.dataset.skin = skin;
        document.documentElement.dataset.theme =
          darkIds.indexOf(skin) !== -1 ? 'dark' : 'light';
      })();
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div>%sveltekit.body%</div>
  </body>
</html>
