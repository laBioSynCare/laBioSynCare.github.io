<!--
  BSC Lab maskable app icon (purpose: maskable) — full-bleed dark field with the
  brand mark inside the central safe zone (content radius ~184px < 205px, the 80%
  safe circle of a 512 icon). Also the source for apple-touch-icon-180.png, since
  iOS renders a full-bleed icon with its own rounding.

  Regenerate the PNGs (needs rsvg-convert):
    rsvg-convert -w 512 -h 512 icon-maskable.svg -o icon-maskable-512.png
    rsvg-convert -w 180 -h 180 icon-maskable.svg -o apple-touch-icon-180.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect x="0" y="0" width="512" height="512" fill="#1a1a2e"/>
  <circle cx="256" cy="256" r="96" fill="none" stroke="#4fc3f7" stroke-width="32"/>
  <circle cx="256"   cy="112" r="40" fill="#4fc3f7"/>
  <circle cx="377.6" cy="328" r="40" fill="#4fc3f7"/>
  <circle cx="134.4" cy="328" r="40" fill="#4fc3f7"/>
</svg>
