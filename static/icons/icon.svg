<!--
  BSC Lab app icon (purpose: any) — the brand mark on its dark disc, scaled ×16
  from ../favicon.svg. Transparent corners. Source for icon-192.png / icon-512.png.

  Regenerate the PNGs (needs rsvg-convert):
    rsvg-convert -w 192 -h 192 icon.svg -o icon-192.png
    rsvg-convert -w 512 -h 512 icon.svg -o icon-512.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <circle cx="256" cy="256" r="224" fill="#1a1a2e"/>
  <circle cx="256" cy="256" r="96" fill="none" stroke="#4fc3f7" stroke-width="32"/>
  <circle cx="256"   cy="112" r="40" fill="#4fc3f7"/>
  <circle cx="377.6" cy="328" r="40" fill="#4fc3f7"/>
  <circle cx="134.4" cy="328" r="40" fill="#4fc3f7"/>
</svg>
