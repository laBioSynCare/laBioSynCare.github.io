name: Validate RDF

# No `paths:` filter on pull_request, deliberately. `RDF validation (Nix)` is a
# required status check on a protected `main`, and GitHub blocks a pull request
# whose required check never reports, which is exactly what a path filter causes
# on a documentation-only change. The filter moved inside the job instead: the
# relevance step below decides whether to run the validators or finish early, so
# the check always reports and a docs PR still costs seconds rather than twelve
# minutes. Push keeps its filter; nothing requires the check there.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'static/ontology/**'
      - 'test/**'
      - 'src/rdf/**'
      - 'scripts/sstim-*.py'
      - 'scripts/sstim-*.mjs'
      - 'scripts/export-ontology.py'
      - 'scripts/collapse-bundle-metadata*.py'
      - 'scripts/bioportal-release.py'
      - 'scripts/bioportal-guards.test.py'
      - 'scripts/check-bioportal-release-integrity.py'
      - 'scripts/verify-bioportal-closure.py'
      - 'scripts/working-tree-hash.py'
      - 'scripts/bioportal-release-integrity.json'
      - 'scripts/BIOPORTAL_RELEASE_INTEGRITY.md'
      - 'docs/ecosystem/w3id/**'
      - 'Makefile'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/pages.yml'
      - '.github/workflows/validate-rdf.yml'

jobs:
  shacl:
    name: RDF validation (Nix)
    runs-on: ubuntu-latest

    steps:
      # Tags are not optional here: truth-audit checks every CHANGELOG release
      # link against the tag it names, and actions/checkout fetches no tags by
      # default. Without this the gate reported all thirteen releases as naming
      # tags that do not exist, while silently skipping the checks that key off
      # the same list.
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0

      # The path filter that used to live under `on:`. Same list, evaluated here
      # so the required check still reports on a change that touches none of it.
      - name: Decide whether this change can affect RDF
        id: relevant
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "Could not establish a validation/ledger baseline." >&2
            exit 1
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --quiet --depth=1 origin "$base"
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Could not resolve baseline commit $base." >&2
            exit 1
          fi
          echo "baseline=$base" >> "$GITHUB_OUTPUT"
          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"; printf '%s\n' "$changed"
          if grep -qE \
            '^(static/ontology/|test/|src/rdf/|docs/ecosystem/w3id/|Makefile$|flake\.(nix|lock)$|\.github/workflows/(pages|validate-rdf)\.yml$|scripts/(sstim-.*\.(py|mjs)|export-ontology\.py|collapse-bundle-metadata[^/]*\.py|bioportal-release\.py|bioportal-guards\.test\.py|check-bioportal-release-integrity\.py|verify-bioportal-closure\.py|working-tree-hash\.py|bioportal-release-integrity\.json|BIOPORTAL_RELEASE_INTEGRITY\.md)$)' \
            <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No RDF-relevant path changed; the validators have nothing to see."
          fi
          if grep -qE \
            '^(static/ontology/void\.ttl$|static/ontology/[0-9]+\.[0-9]+\.[0-9]+/|Makefile$|flake\.(nix|lock)$|scripts/(collapse-bundle-metadata[^/]*\.py|bioportal-release\.py|verify-bioportal-closure\.py|bioportal-release-integrity\.json)$)' \
            <<< "$changed"; then
            echo "bioportal=true" >> "$GITHUB_OUTPUT"
          else
            echo "bioportal=false" >> "$GITHUB_OUTPUT"
          fi

      # Toolchain (python3.12 + pyshacl + ROBOT) comes from the pinned flake
      # devShell, so local `make validate` and CI run the same validators.
      - name: Install Nix
        if: steps.relevant.outputs.run == 'true'
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Enforce append-only BioPortal release records
        if: steps.relevant.outputs.run == 'true'
        run: nix develop --command python3 scripts/check-bioportal-release-integrity.py --baseline-ref "${{ steps.relevant.outputs.baseline }}"

      # Nix pins the toolchain; this caches the npm package downloads only.
      - name: Cache npm downloads
        if: steps.relevant.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # `make validate` runs the SPARQL sanity and ecosystem runtime contract
      # suites, which import N3, Comunica, Vitest, and rdf-validate-shacl.
      - name: Install dependencies
        if: steps.relevant.outputs.run == 'true'
        run: nix develop --command npm ci

      # -j4 because validate's prerequisites are independent scripts working in
      # their own mktemp dirs.
      # Measured locally, every gate passing: 432s serial, 192s with -j4, 218s
      # with -j4 -Otarget; the 26s buys grouped per-target output, without which
      # an interleaved parallel failure is unreadable.
      #
      # That local ratio does NOT transfer to CI and nobody should quote it as
      # if it does. The runner has 4 cores and ecosystem-contract already spawns
      # min(4, cpu_count) pySHACL workers by itself, so make-level -j mostly
      # oversubscribes. Worse, runner-to-runner variance is larger than the
      # effect: the same commit running the same `make validate` took 629s on
      # one runner and 867s on another, a 38% spread, and the first runs after
      # this change were 665s and 551s. Direction is mildly positive, n is too
      # small to claim anything. Collect samples before tuning -j further, and
      # drop to plain `make validate` when bisecting a flaky gate.
      - name: Run RDF, SHACL, OWL, quality, query, and export validation
        if: steps.relevant.outputs.run == 'true'
        run: nix develop --command make -j4 -Otarget validate

      # The generic suite never rebuilds a frozen distribution. Exercise the
      # expensive two-build byte invariant only when the selector, frozen
      # closure, generator, ledger, or pinned toolchain actually changed.
      - name: Reproduce the BioPortal bundle when its inputs changed
        if: steps.relevant.outputs.run == 'true' && steps.relevant.outputs.bioportal == 'true'
        run: nix develop --command make bioportal-reproducible
