name: Validate RDF

on:
  pull_request:
    paths:
      - 'static/ontology/**'
      - 'Makefile'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/validate-rdf.yml'
  push:
    branches:
      - main
    paths:
      - 'static/ontology/**'
      - 'Makefile'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/validate-rdf.yml'

jobs:
  shacl:
    name: pySHACL validation (Nix)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Toolchain (python3.12 + pyshacl) comes from the pinned flake devShell,
      # so local `make validate` and CI run the exact same pySHACL version.
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run SHACL validation
        run: nix develop --command make validate
