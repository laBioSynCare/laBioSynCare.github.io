name: Validate RDF

on:
  pull_request:
    paths:
      - 'static/ontology/**'
      - 'src/rdf/loader.js'
      - 'scripts/sstim-quality-audit.py'
      - 'scripts/sstim-exposure-sanity.mjs'
      - 'scripts/export-ontology.py'
      - 'Makefile'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/validate-rdf.yml'
  push:
    branches:
      - main
    paths:
      - 'static/ontology/**'
      - 'src/rdf/loader.js'
      - 'scripts/sstim-quality-audit.py'
      - 'scripts/sstim-exposure-sanity.mjs'
      - 'scripts/export-ontology.py'
      - 'Makefile'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/validate-rdf.yml'

jobs:
  shacl:
    name: RDF validation (Nix)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Toolchain (python3.12 + pyshacl + ROBOT) comes from the pinned flake
      # devShell, so local `make validate` and CI run the same validators.
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Nix pins the toolchain; this caches the npm package downloads only.
      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # `make validate` runs the SPARQL sanity script (scripts/sstim-exposure-sanity.mjs),
      # which imports n3 and @comunica/query-sparql-rdfjs from node_modules.
      - name: Install dependencies
        run: nix develop --command npm ci

      - name: Run RDF, SHACL, OWL, quality, query, and export validation
        run: nix develop --command make validate
