# WIDOCO configuration for `make ontology-docs`.
# Only fills fields that are absent from the ontology's own metadata —
# everything else (title, version, authors, license, DOI) is extracted from
# the manifest-defined Full semantic union via -getOntologyMetadata. Keep this
# file to gap-filling only;
# ontology metadata belongs in the ontology.
#
# The abstract is user-facing copy: conservative wellness framing only
# (see docs/concept/SCOPE.md). No health, medical, or treatment claims.
abstract=The Sensory Stimulation Ontology (SSTIM) provides OWL classes, SKOS vocabulary, and SHACL shapes for describing sensory stimulation techniques, protocols, presets, evidence chains, and safety metadata. This page documents the live Full-profile OWL classes and properties; the multilingual SKOS vocabulary (frequency bands, modalities, mechanisms, techniques, evidence tiers, cautions) has its own reference at <a href="vocab/">the SKOS vocabulary documentation</a>. The displayed version identifies whether these generated docs describe a mutable development line; cite the latest immutable snapshot named in the project documentation instead of a <code>-dev</code> build. Every term documented here can also be <a href="../../graph/">explored interactively in the SSTIM Graph Navigator</a>: the ontology IRI fragment of a term (for example <code>#FrequencyBand</code>) selects the corresponding node in the live graph view.
