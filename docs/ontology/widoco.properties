# WIDOCO configuration for `make ontology-docs`.
# Only fills fields that are absent from the ontology's own metadata —
# everything else (title, version, authors, license, DOI) is extracted from
# sstim-core.ttl via -getOntologyMetadata. Keep this file to gap-filling only;
# ontology metadata belongs in the ontology.
#
# The abstract is user-facing copy: conservative wellness framing only
# (see docs/concept/SCOPE.md). No health, medical, or treatment claims.
abstract=The Sensory Stimulation Ontology (SSTIM) provides OWL classes, SKOS vocabulary, and SHACL shapes for describing sensory stimulation techniques, protocols, presets, evidence chains, and safety metadata. This reference documentation is generated from the released ontology. Every term documented here can also be <a href="https://labiosyncare.github.io/">explored interactively in the BSC Lab knowledge browser</a>: the ontology IRI fragment of a term (for example <code>#FrequencyBand</code>) selects the corresponding node in the live graph view.
